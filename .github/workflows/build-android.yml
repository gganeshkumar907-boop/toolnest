name: Build AllToolNest Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'assets/alltoolnest-app-icon.png'
      - 'banner-icons.jpg'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg banner-icons.jpg www/
      - name: Install Capacitor
        run: npm install
      - name: Sync app files
        run: npx cap sync android
      - name: Apply AllToolNest launcher icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import os
          source = Image.open('assets/alltoolnest-app-icon.png').convert('RGBA')
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              out = f'android/app/src/main/res/{folder}'
              os.makedirs(out, exist_ok=True)
              icon = source.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(f'{out}/ic_launcher.png')
              icon.save(f'{out}/ic_launcher_round.png')
          PY
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllToolNest-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
