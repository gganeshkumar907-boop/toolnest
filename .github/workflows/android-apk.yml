name: Build AllToolNest Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug lintDebug
        working-directory: android
      - name: Verify APK structure, package and signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 15000
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.alltoolnest.fresh'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          unzip -p "$APK" assets/public/index.html | grep -q 'id="calc"'
          unzip -p "$APK" assets/public/index.html | grep -q 'id="pdf"'
          unzip -p "$APK" assets/public/index.html | grep -q 'id="photo"'
          unzip -p "$APK" assets/public/index.html | grep -q 'id="resume"'
          unzip -p "$APK" assets/public/index.html | grep -q 'id="names"'
          unzip -p "$APK" assets/public/index.html | grep -q 'id="ai"'
      - name: Upload one installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AllToolNest-Fresh-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
