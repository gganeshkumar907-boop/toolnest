name: Build AllToolNest Android APK
# Build a clean standalone package, then verify package ID and APK signature.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: android
      - name: Verify standalone package and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.alltoolnest.fresh'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          test "$(stat -c%s "$APK")" -gt 15000
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.alltoolnest.fresh 1
            sleep 8
            adb shell pidof com.alltoolnest.fresh
      - name: Upload one installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AllToolNest-Fresh-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
